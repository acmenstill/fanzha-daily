(function () {
  try {
    var saved = localStorage.getItem('fz-theme');
    var mode = saved === 'light' || saved === 'dark' ? saved : 'auto';
    var root = document.documentElement;
    if (mode === 'auto') {

    }
    root.setAttribute('data-theme', mode);

})();
